spring.application.name=jey-avila
server.port=8080

# Detrás del proxy del VPS (nginx): respeta X-Forwarded-* para la IP real y https
server.forward-headers-strategy=native

# ── Datos ────────────────────────────────────────────────────────────────────
# Todo lo que cambia (base de datos e imágenes subidas) vive en esta carpeta, que en Docker
# es un volumen: sobrevive a cada nuevo despliegue.
app.datos=${APP_DATOS:./datos}
spring.datasource.url=jdbc:h2:file:${app.datos}/jey;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=jey
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# ── Acceso al panel ──────────────────────────────────────────────────────────
# Correo y contraseña del administrador. Se leen al arrancar: la contraseña se guarda
# encriptada (BCrypt) en la base de datos, nunca en texto plano ni en el frontend.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Sesión del panel: cookie HttpOnly; "segura" (solo https) en producción
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SEGURA:false}
server.servlet.session.cookie.name=JEYSESION

# Imágenes de la agenda
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB

# Respuestas comprimidas
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml
